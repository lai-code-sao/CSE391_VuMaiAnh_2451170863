<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopTLU - Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header class="header">
        <div class="logo">ShopTLU</div>
        
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">☰</label>
        
        <nav class="nav-menu">
            <a href="#">Trang chủ</a>
            <a href="#" class="active">Sản phẩm</a>
            <a href="#">Tin tức</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="main-layout">
        
        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <div class="filter-group">
                <label for="sort">Sắp xếp:</label>
                <select id="sort">
                    <option>Giá tăng dần</option>
                    <option>Giá giảm dần</option>
                    <option>Bán chạy nhất</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="category">Danh mục:</label>
                <select id="category">
                    <option>Tất cả</option>
                    <option>Áo Hoodie</option>
                    <option>Áo Polo</option>
                    <option>Phụ kiện</option>
                </select>
            </div>
        </aside>
        <aside class="ads-bar">
            <div class="ads-box">Quảng cáo siêu ưu đãi kỉ niệm thành lập trường!</div>
            <div class="ads-box">Miễn phí ship toàn quốc cho đơn hàng từ 500k.</div>
        </aside>

    </div>
</body>
</html>
