<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopTLU - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            
            <div class="col-md-3 col-lg-2 bg-dark min-vh-100 position-fixed top-0 start-0 p-3 z-3 d-none d-md-block">
                <a href="#" class="d-block text-white text-decoration-none fs-4 fw-bold mb-4 text-center">TLU Admin</a>
                <div class="list-group list-group-flush">
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 active bg-primary rounded mb-1">📊 Tổng quan</a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-1">📦 Sản phẩm</a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-1">🛒 Đơn hàng</a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-1">👥 Khách hàng</a>
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-1">⚙️ Cài đặt</a>
                </div>
            </div>

            <main class="col-12 col-md-9 col-lg-10 ms-auto p-4">
                
                <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-4">
                    <nav aria-label="breadcrumb" class="m-0">
                        <ol class="breadcrumb m-0 bg-transparent p-0">
                            <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Hệ thống</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Tổng quan quản trị</li>
                        </ol>
                    </nav>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle btn-sm fw-bold" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            👤 Admin: Mai Anh
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                            <li><a class="dropdown-menu-item dropdown-item small" href="#">Hồ sơ cá nhân</a></li>
                            <li><a class="dropdown-menu-item dropdown-item small" href="#">Nhật ký hoạt động</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-menu-item dropdown-item small text-danger" href="#">Đăng xuất</a></li>
                        </ul>
                    </div>
                </div>

                <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <strong>Thành công!</strong> Đồng bộ dữ liệu hệ thống kho hàng ShopTLU hoàn tất lúc 22:30.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
